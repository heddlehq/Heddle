# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Notion's API, through a public integration: a system admin creates it at
# https://www.notion.so/profile/integrations and gives Heddle its client ID and secret.
id: notion
name: Notion
version: 1.0.0
description: Search, create and read pages and databases in Notion.
icon: hero-document-text
base_url: https://api.notion.com/v1/

credential:
  label: Notion
  auth:
    type: oauth2
    authorize_url: https://api.notion.com/v1/oauth/authorize
    token_url: https://api.notion.com/v1/oauth/token
    token_auth: basic
    token_body: json
    authorize_params:
      owner: user

errors:
  message_path: message

triggers:
  - name: New Database Row
    description: Starts the flow for each new row of a database, checking every 5 minutes.
    fields:
      - {name: database_id, label: Database ID}
    request:
      method: POST
      path: "databases/{{fields.database_id}}/query"
      headers:
        Notion-Version: "2022-06-28"
      body:
        sorts:
          - timestamp: created_time
            direction: descending
        page_size: 50
    output:
      path: results
      pick: [id, url, created_time, properties]
    poll:
      every: 5
      id: id

actions:
  - name: Search
    description: Finds the pages and databases shared with the integration, by title.
    fields:
      - {name: query, label: Text in the title}
      - name: object
        label: Find
        type: select
        default: page
        options:
          - {label: Pages, value: page}
          - {label: Databases, value: database}
    request:
      method: POST
      path: search
      headers:
        Notion-Version: "2022-06-28"
      body:
        query: "{{fields.query}}"
        filter:
          property: object
          value: "{{fields.object}}"
        page_size: 100
    output:
      path: results
      pick: [id, object, url, properties, title]

  - name: Query Database
    description: Returns the rows of a database.
    fields:
      - {name: database_id, label: Database ID}
    request:
      method: POST
      path: "databases/{{fields.database_id}}/query"
      headers:
        Notion-Version: "2022-06-28"
      body:
        page_size: 100
    output:
      path: results
      pick: [id, url, properties]

  - name: Create Page
    description: Creates a page inside another page, with a title and a first paragraph.
    fields:
      - {name: parent_id, label: Parent page ID}
      - {name: title, label: Title}
      - {name: text, label: Text, type: textarea}
    request:
      method: POST
      path: pages
      headers:
        Notion-Version: "2022-06-28"
      body:
        parent:
          page_id: "{{fields.parent_id}}"
        properties:
          title:
            - text:
                content: "{{fields.title}}"
        children:
          - object: block
            type: paragraph
            paragraph:
              rich_text:
                - type: text
                  text:
                    content: "{{fields.text}}"
    output:
      pick: [id, url]

  - name: Append Text
    description: Adds a paragraph to the end of a page.
    fields:
      - {name: page_id, label: Page ID, default: "{{result.id}}"}
      - {name: text, label: Text, type: textarea}
    request:
      method: PATCH
      path: "blocks/{{fields.page_id}}/children"
      headers:
        Notion-Version: "2022-06-28"
      body:
        children:
          - object: block
            type: paragraph
            paragraph:
              rich_text:
                - type: text
                  text:
                    content: "{{fields.text}}"
    output:
      value:
        page_id: "{{fields.page_id}}"
