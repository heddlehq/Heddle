openapi: 3.1.0
info:
  title: Heddle Public API
  version: 1.0.0
  description: |
    Public API for managing Heddle workflows, node definitions, and workflow executions.

    Authentication is performed per request with a Heddle API key. Use the
    `Authorization: Bearer <api-key>` header. The `X-Heddle-API-Key` header is
    also accepted for integrations that cannot set `Authorization`.

    API keys are scoped. Each endpoint documents the required scope.

    A key belongs to a person and to one workspace. It reaches only the
    workflows, executions and credentials of that workspace: a workflow of
    another workspace answers `404`, as if it didn't exist. It also does no more
    than the role its owner has in that workspace at the time of the request:

    | Role       | Can                                                          |
    |------------|--------------------------------------------------------------|
    | `viewer`   | read workflows, executions and nodes                         |
    | `operator` | also run workflows                                           |
    | `editor`   | also create, change and delete workflows, and use the agent  |
    | `admin`    | also manage the workspace, its members and every key in it   |

    A request the scopes allow but the role doesn't answers `403`. A key stops
    working, with `401`, when its owner leaves the workspace.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Health
    description: Basic unauthenticated health check.
  - name: Nodes
    description: Node definitions available for building workflow graphs.
  - name: Workflows
    description: Workflow CRUD operations.
  - name: Executions
    description: Queue and inspect workflow executions.
  - name: Versions
    description: Publish a workflow, and look at or bring back what it had before.
security:
  - bearerApiKey: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Health check
      description: Returns a simple liveness payload without requiring an API key.
      security: []
      responses:
        "200":
          description: API is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/nodes:
    get:
      operationId: listNodes
      tags:
        - Nodes
      summary: List node definitions
      description: Requires `nodes:read`.
      security:
        - bearerApiKey: []
      responses:
        "200":
          description: Node definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/nodes/{type}:
    get:
      operationId: getNode
      tags:
        - Nodes
      summary: Get one node definition
      description: |
        Requires `nodes:read`.

        The `type` path parameter is a slug-like version of the node `name` or `title`.
        Example: `Evaluate Code` can be requested as `evaluate-code`.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/NodeType"
      responses:
        "200":
          description: Node definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workflows:
    get:
      operationId: listWorkflows
      tags:
        - Workflows
      summary: List workflows
      description: Requires `workflows:read`.
      security:
        - bearerApiKey: []
      responses:
        "200":
          description: Workflows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkflow
      tags:
        - Workflows
      summary: Create workflow
      description: Requires `workflows:write`.
      security:
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRequest"
            examples:
              minimal:
                value:
                  workflow:
                    name: My workflow
                    nodes: []
                    connections: []
      responses:
        "201":
          description: Created workflow.
          headers:
            location:
              description: URL of the created workflow.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/workflows/{id}:
    get:
      operationId: getWorkflow
      tags:
        - Workflows
      summary: Get workflow
      description: Requires `workflows:read`.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: Workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceWorkflow
      tags:
        - Workflows
      summary: Replace workflow fields
      description: Requires `workflows:write`.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRequest"
      responses:
        "200":
          description: Updated workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      operationId: updateWorkflow
      tags:
        - Workflows
      summary: Update workflow fields
      description: Requires `workflows:write`.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRequest"
      responses:
        "200":
          description: Updated workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteWorkflow
      tags:
        - Workflows
      summary: Delete workflow
      description: Requires `workflows:delete`.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "204":
          description: Workflow deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workflows/{workflow_id}/agent:
    get:
      summary: Get the conversation with the agent of a workflow
      description: Each person has one conversation per workflow, shared by all their clients. It lives on the server and ends after 30 minutes without work.
      operationId: getAgentConversation
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
      responses:
        "200":
          description: The conversation so far
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AgentTranscript"
  /api/v1/workflows/{workflow_id}/agent/events:
    get:
      summary: Follow the agent as it works
      description: |
        A stream of server-sent events. The first one is `snapshot`, with the whole conversation. Then come
        `user_message`, `text_delta`, `tool_started`, `tool_finished`, `failed`, `status`, `permission` and `reset`.
      operationId: followAgent
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
      responses:
        "200":
          description: The stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/workflows/{workflow_id}/agent/messages:
    post:
      summary: Send a message to the agent
      description: The agent changes the workflow, so the key's owner must be an editor or admin.
      operationId: sendAgentMessage
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
      responses:
        "202":
          description: The agent started. Follow it through the events.
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The agent is still working
  /api/v1/workflows/{workflow_id}/agent/decision:
    post:
      summary: Answer a request of the agent to run the flow
      operationId: decideAgentRun
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - once
                    - always
                    - deny
      responses:
        "204":
          description: Answered
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Nothing is waiting for an answer
  /api/v1/workflows/{workflow_id}/agent/new:
    post:
      summary: Start a new conversation
      description: The current one stays saved. While the agent works, nothing changes.
      operationId: newAgentConversation
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
      responses:
        "204":
          description: Done
  /api/v1/workflows/{workflow_id}/agent/stop:
    post:
      summary: Stop what the agent is doing
      operationId: stopAgent
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
      responses:
        "204":
          description: Stopped
  /api/v1/workflows/{workflow_id}/executions:
    get:
      operationId: listWorkflowExecutions
      tags:
        - Executions
      summary: List workflow executions
      description: |
        Requires `executions:read`.

        Supports pagination with `page` and `per_page`, plus filters
        `status`, `inserted_after` and `inserted_before`.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/ExecutionStatus"
        - $ref: "#/components/parameters/InsertedAfter"
        - $ref: "#/components/parameters/InsertedBefore"
      responses:
        "200":
          description: Workflow executions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createWorkflowExecution
      tags:
        - Executions
      summary: Queue workflow execution
      description: |
        Requires `executions:write`.

        Creates a queued execution and enqueues an Oban job. The API currently
        returns `202 Accepted` with the execution status.

        It runs the published version of the workflow, as webhooks and schedules
        do, and answers `409` for a workflow that was never published. With
        `version: draft`, it runs the draft as it is saved now.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionRequest"
            examples:
              variables:
                value:
                  input:
                    variables:
                      x: 10
      responses:
        "202":
          description: Execution queued.
          headers:
            location:
              description: URL of the queued execution.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotPublished"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/workflows/{workflow_id}/versions:
    get:
      operationId: listWorkflowVersions
      tags:
        - Versions
      summary: List workflow versions
      description: |
        Requires `workflows:read`.

        The graph of a workflow is its draft. Production (webhooks, schedules, error
        flows and executions started here) runs its published version, the one with
        `live`. Besides the published ones, a workflow keeps its draft as a
        `checkpoint` every so often and before it is replaced, and as a `run` when a
        run takes it. The 100 newest come first, each with what it changed from the
        one before.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
      responses:
        "200":
          description: The versions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workflows/{workflow_id}/versions/{version_id}:
    get:
      operationId: getWorkflowVersion
      tags:
        - Versions
      summary: Get a workflow version, with its graph
      description: Requires `workflows:read`.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workflows/{workflow_id}/publish:
    post:
      operationId: publishWorkflow
      tags:
        - Versions
      summary: Publish the draft
      description: |
        Requires `workflows:write`, and the role editor or above.

        The draft becomes what production runs. Runs already going keep the version
        they started with.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "201":
          description: The version published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workflows/{workflow_id}/versions/{version_id}/publish:
    post:
      operationId: publishWorkflowVersion
      tags:
        - Versions
      summary: Put an older version back in production
      description: |
        Requires `workflows:write`, and the role editor or above.

        Publishes a new version with the graph of an older one, and leaves the draft
        as it is: for when what was published broke something.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "201":
          description: The version published, with `source_version_number`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workflows/{workflow_id}/versions/{version_id}/restore:
    post:
      operationId: restoreWorkflowVersion
      tags:
        - Versions
      summary: Restore a version into the draft
      description: |
        Requires `workflows:write`, and the role editor or above.

        The draft takes the graph of the version. What the draft had is kept as a
        checkpoint first. Production keeps running what is published.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: The workflow, with its new draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workflows/{workflow_id}/executions/{public_id}:
    get:
      operationId: getWorkflowExecution
      tags:
        - Executions
      summary: Get workflow execution
      description: Requires `executions:read`.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/WorkflowIdByWorkflowId"
        - $ref: "#/components/parameters/ExecutionPublicId"
      responses:
        "200":
          description: Workflow execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: Heddle API key
      description: API key in the format `hd_live_<prefix>_<secret>`.
    heddleApiKeyHeader:
      type: apiKey
      in: header
      name: X-Heddle-API-Key
      description: Alternative API key header.
  parameters:
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: integer
      description: Version id.
    WorkflowId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Workflow numeric ID.
    WorkflowIdByWorkflowId:
      name: workflow_id
      in: path
      required: true
      schema:
        type: integer
      description: Workflow numeric ID.
    ExecutionPublicId:
      name: public_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      description: Human-readable execution public ID.
    NodeType:
      name: type
      in: path
      required: true
      schema:
        type: string
      description: Slug-like node type, for example `start` or `evaluate-code`.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ExecutionStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - queued
          - running
          - waiting
          - succeeded
          - failed
      description: Filter executions by status.
    InsertedAfter:
      name: inserted_after
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Return executions inserted at or after this UTC timestamp.
    InsertedBefore:
      name: inserted_before
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Return executions inserted at or before this UTC timestamp.
  responses:
    Unauthorized:
      description: Missing or invalid API key, or one whose owner left its workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: Unauthorized
    Forbidden:
      description: |
        The API key doesn't have the required scope, or its owner's role in the
        key's workspace doesn't allow the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              value:
                error:
                  code: forbidden
                  message: Forbidden
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                error:
                  code: not_found
                  message: Not Found
    NotPublished:
      description: The workflow has no published version, so production can't run it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notPublished:
              value:
                error:
                  code: not_published
                  message: >-
                    This workflow has no published version. Publish it, or run its
                    draft with version=draft.
    ValidationError:
      description: Request payload failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type:
                - object
                - "null"
              additionalProperties: true
    WorkflowRequest:
      type: object
      required:
        - workflow
      properties:
        workflow:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            nodes:
              type: array
              items:
                $ref: "#/components/schemas/FlowNode"
              default: []
            connections:
              type: array
              items:
                $ref: "#/components/schemas/FlowConnection"
              default: []
            comments:
              type: array
              description: Leave it out to keep the workflow's comments as they are.
              items:
                $ref: "#/components/schemas/Comment"
    WorkflowListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    WorkflowResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Workflow"
    Workflow:
      type: object
      required:
        - id
        - name
        - nodes
        - connections
      properties:
        id:
          type: integer
        name:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/FlowNode"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/FlowConnection"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        published_version_id:
          type:
            - integer
            - "null"
          description: >-
            The version production runs. The nodes, connections and comments above
            are the draft, and a workflow without a published version isn't in
            production yet.
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Version:
      type: object
      required:
        - id
        - number
        - kind
        - live
      properties:
        id:
          type: integer
        number:
          type: integer
          description: Counts the versions of the workflow, from 1.
        kind:
          type: string
          enum:
            - publish
            - checkpoint
            - run
          description: >-
            `publish`, someone published it; `checkpoint`, the draft kept on its own;
            `run`, the draft as a run took it.
        live:
          type: boolean
          description: Whether production runs this version.
        note:
          type:
            - string
            - "null"
        author:
          oneOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        source_version_number:
          type:
            - integer
            - "null"
          description: For a version that put an older one back in production, that one.
        changes:
          type: object
          additionalProperties:
            type: integer
          description: >-
            In a list, what changed from the version before, by count: nodes_added,
            nodes_removed, nodes_changed, nodes_moved, connections_added,
            connections_removed, connections_reordered and comments_changed.
        contributors:
          type: array
          items:
            $ref: "#/components/schemas/Person"
          description: In a list, who changed the draft since the version before.
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/FlowNode"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/FlowConnection"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        inserted_at:
          type: string
          format: date-time
    Person:
      type: object
      properties:
        id:
          type: integer
        username:
          type:
            - string
            - "null"
        email:
          type: string
    VersionListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Version"
    VersionResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Version"
    PublishRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: What changed, for whoever reads the history.
    Comment:
      type: object
      additionalProperties: false
      description: >-
        Text written on the canvas. It never runs, but a `section` groups the nodes
        drawn inside it: with `manual`, they don't run with the flow, only when a run is
        given its `section_id`.
      required:
        - id
        - kind
        - color
        - text
        - position
        - width
        - height
      properties:
        id:
          oneOf:
            - type: string
            - type: integer
        kind:
          type: string
          enum: [title, text, note, section]
        color:
          type: string
          enum: [default, yellow, green, blue, red]
        text:
          type: string
        position:
          type: object
          required:
            - x
            - y
          properties:
            x:
              type: number
            y:
              type: number
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
        manual:
          type: boolean
          default: false
          description: >-
            Only on a section. Its nodes don't run with the flow: a branch that reaches
            one stops there, and their Start, Schedule and Webhook nodes don't fire.
        nodes:
          type: array
          description: >-
            Only on a section. The ids of the nodes drawn inside it, kept by the canvas,
            in the order its entry nodes run.
          items:
            oneOf:
              - type: string
              - type: integer
    FlowNode:
      type: object
      additionalProperties: false
      description: A step of a flow.
      required:
        - id
        - type
        - controls
      properties:
        id:
          oneOf:
            - type: string
            - type: integer
        type:
          type: string
        label:
          type: string
        position:
          type: object
          additionalProperties: false
          description: Where the node is on the canvas. It has no effect on a run, and a node without it is placed automatically.
          required:
            - x
            - y
          properties:
            x:
              type: number
            y:
              type: number
        controls:
          type: object
          additionalProperties: true
    FlowConnection:
      type: object
      additionalProperties: false
      description: Connections leaving the same output run one after the other, in the order they are listed.
      required:
        - source
        - sourceOutput
        - target
      properties:
        source:
          oneOf:
            - type: string
            - type: integer
        sourceOutput:
          type: string
        target:
          oneOf:
            - type: string
            - type: integer
        targetInput:
          type: string
          default: exec
    AgentTranscript:
      type: object
      required:
        - items
        - status
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - id
              - role
            properties:
              id:
                type: string
              role:
                type: string
                enum:
                  - user
                  - assistant
                  - tool
                  - error
        status:
          type: string
          enum:
            - idle
            - running
        permission:
          type:
            - object
            - "null"
          additionalProperties: true
          description: >-
            What the agent waits for the person to allow: `flow_name`, `action`
            (`run`, `publish` or `restore`) and, for a version, its `version` number.
    NodeListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NodeDefinition"
    NodeResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/NodeDefinition"
    NodeDefinition:
      type: object
      required:
        - type
        - title
        - inputs
        - outputs
        - ui_fields
      properties:
        type:
          type: string
        title:
          type: string
        description:
          type:
            - string
            - "null"
        category:
          type:
            - string
            - "null"
        color:
          type:
            - string
            - "null"
        icon:
          type:
            - string
            - "null"
        show:
          type: boolean
        inputs:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                additionalProperties: true
        outputs:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                additionalProperties: true
        ui_fields:
          type: array
          items:
            type: object
            additionalProperties: true
    ExecutionRequest:
      type: object
      properties:
        input:
          type: object
          additionalProperties: true
          default: {}
          description: >-
            Execution input. The API sets `trigger` to `api` when absent. With
            `section_id`, the id of a section comment, it runs only that section, from
            each node nothing in it leads to.
        version:
          type: string
          enum:
            - published
            - draft
          default: published
          description: >-
            Which graph runs: the published version, as production does, or the draft
            as it is saved now.
    ExecutionListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Execution"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginationMeta:
      type: object
      required:
        - page
        - per_page
        - total
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
    ExecutionResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Execution"
    ExecutionStep:
      type: object
      additionalProperties: true
      properties:
        node_id:
          type: string
        node_type:
          type: string
        label:
          type: string
          description: The name of the node, when it isn't its type.
        status:
          type: string
          enum: [success, error, skipped]
        output:
          type: string
          description: The output the run left the node through.
        started_at:
          type: string
          format: date-time
        duration_ms:
          type: number
        attempts:
          type: integer
          description: How many tries the step took, when it took more than one.
        retry_errors:
          type: array
          items:
            type: string
          description: Why each try before the last one failed.
        error:
          type: string
        continued:
          type: boolean
          description: The step failed, and the run went on with the error as its result.
        pinned:
          type: boolean
          description: The step took the data pinned to its node instead of running.
        data:
          description: >-
            The context the step got and what it changed, cut to a size that can be
            kept. Only the first 500 steps of a run keep it.
          type: object
          properties:
            input:
              type: object
              additionalProperties: true
            output:
              type: object
              additionalProperties: true
            removed:
              type: array
              items:
                type: string
            truncated:
              type: boolean
              description: Part of the data was cut, so it isn't the whole value.
            omitted:
              type: boolean
              description: The run had too many steps to keep this one's data.

    Execution:
      type: object
      required:
        - id
        - internal_id
        - workflow_id
        - status
        - input
        - logs
      properties:
        id:
          type: string
          description: Human-readable execution public ID.
          example: blue-orbit-route
        internal_id:
          type: string
          format: uuid
        workflow_id:
          type: integer
        status:
          type: string
          enum:
            - queued
            - running
            - waiting
            - succeeded
            - failed
        input:
          type: object
          additionalProperties: true
        result:
          type:
            - object
            - "null"
          additionalProperties: true
        error:
          type:
            - object
            - "null"
          additionalProperties: true
        logs:
          description: >-
            One entry for each step the run took, in order.
          type: array
          items:
            $ref: "#/components/schemas/ExecutionStep"
        waiting:
          description: >-
            Where a run a Wait node paused stands, while its status is `waiting`.
            It goes on by itself at `until`, or when the address the flow reads as
            `{{resume_url}}` is called, when `for_call` is true.
          type:
            - object
            - "null"
          properties:
            node_id:
              type: string
            until:
              type:
                - string
                - "null"
              format: date-time
            for_call:
              type: boolean
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
